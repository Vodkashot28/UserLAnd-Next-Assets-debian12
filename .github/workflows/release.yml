name: Build and Release Debian 12 Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            docker_image: arm64v8/debian:bookworm
          - arch: arm
            platform: linux/arm/v7
            docker_image: arm32v7/debian:bookworm
          - arch: x86_64
            platform: linux/amd64
            docker_image: amd64/debian:bookworm
          - arch: x86
            platform: linux/386
            docker_image: i386/debian:bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rootfs
        run: |
          mkdir -p output
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/input:/input:ro" \
            -v "$PWD/output:/output" \
            ${{ matrix.docker_image }} \
            bash /input/main.sh

      - name: Package assets
        run: |
          ARCH=${{ matrix.arch }}
          mkdir -p release/assets
          cp assets/all/* release/assets/
          rm release/assets/assets.txt
          cp output/busybox release/assets/
          cp output/libdisableselinux.so release/assets/
          tar -czvf release/${ARCH}-assets.tar.gz -C release/assets/ .
          for f in $(ls release/assets/); do
            echo "$f $(date +%s -r release/assets/$f) $(md5sum release/assets/$f | awk '{ print $1 }')" >> release/${ARCH}-assets.txt
          done
          cp output/rootfs.tar.gz release/${ARCH}-rootfs.tar.gz
          rm -rf release/assets

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.arch }}
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            Debian 12 Bookworm assets for UserLAnd-Next.
            Includes Python, NumPy, SciPy, and pandas for AI/ML workflows.
          files: release/**
